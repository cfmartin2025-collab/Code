[project]
name = "apple-calendar-mcp"
version = "0.1.0"
description = "MCP server for Apple iCloud Calendar over CalDAV"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "caldav>=3.7,<4",
    "icalendar>=7,<8",
]

[project.scripts]
apple-calendar-mcp = "apple_calendar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
